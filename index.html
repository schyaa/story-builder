<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<title>AI Story Prompt Builder</title>
<style>
body{
font-family:Arial, Helvetica, sans-serif;
text-align:center;
background:#f4f6fb;
margin:40px;
}

h1{
margin-bottom:30px;
}

.section{
margin-top:25px;
}

button{
padding:14px 18px;
margin:6px;
font-size:18px;
border-radius:12px;
border:none;
cursor:pointer;
background:#e0e0e0;
}

button:hover{
transform:scale(1.05);
}

.selected{
background:#4CAF50;
color:white;
}

#generateBtn{
margin-top:30px;
background:#2196F3;
color:white;
}

#copyBtn{
margin-top:15px;
background:#ff9800;
color:white;
}

#result{
margin-top:30px;
font-size:18px;
background:white;
padding:20px;
border-radius:12px;
width:70%;
margin-left:auto;
margin-right:auto;
}

</style>
</head>
<body>

<h1>สร้างนิทานด้วย AI</h1>

<div class="section" id="characters">
<h3>เลือกตัวละคร</h3>
<button onclick="selectOption('character','robot',this)">🤖 หุ่นยนต์</button>
<button onclick="selectOption('character','dinosaur',this)">🦖 ไดโนเสาร์</button>
<button onclick="selectOption('character','rabbit',this)">🐰 กระต่าย</button>
<button onclick="selectOption('character','cat',this)">🐱 แมว</button>
</div>

<div class="section" id="places">
<h3>เลือกสถานที่</h3>
<button onclick="selectOption('place','forest',this)">🌳 ป่า</button>
<button onclick="selectOption('place','space',this)">🚀 อวกาศ</button>
<button onclick="selectOption('place','ocean',this)">🌊 ใต้น้ำ</button>
<button onclick="selectOption('place','school',this)">🏫 โรงเรียน</button>
</div>

<div class="section" id="missions">
<h3>เลือกเหตุการณ์</h3>
<button onclick="selectOption('mission','find treasure',this)">💎 หาสมบัติ</button>
<button onclick="selectOption('mission','help a friend',this)">🤝 ช่วยเพื่อน</button>
<button onclick="selectOption('mission','lost adventure',this)">🧭 หลงทาง</button>
<button onclick="selectOption('mission','discover magic',this)">✨ เจอของวิเศษ</button>
</div>

<button id="generateBtn" onclick="generatePrompt()">สร้าง Prompt</button>

<div id="result"></div>

<button id="copyBtn" onclick="copyPrompt()">คัดลอก Prompt</button>

<script>

let character=""
let place=""
let mission=""

function selectOption(type,value,button){

let parent=button.parentElement
let buttons=parent.getElementsByTagName('button')

for(let b of buttons){
b.classList.remove('selected')
}

button.classList.add('selected')

if(type==='character') character=value
if(type==='place') place=value
if(type==='mission') mission=value

}

function generatePrompt(){

if(character==='' || place==='' || mission===''){
document.getElementById('result').innerText='กรุณาเลือกให้ครบก่อน'
return
}

let prompt=`cute ${character} in ${place} going on an adventure to ${mission}, children story illustration`

window.generatedPrompt=prompt

document.getElementById('result').innerText=prompt

}

function copyPrompt(){

if(!window.generatedPrompt){
alert('ต้องสร้าง Prompt ก่อน')
return
}

navigator.clipboard.writeText(window.generatedPrompt)

alert('คัดลอก Prompt แล้ว!')

}

</script>

</body>
</html>
